
<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Gráfico de Funções</title>
		<link rel="icon" href="assets/img/icon.ico">
		<link rel="stylesheet" href="estilos/padrao.css">
		<link rel="stylesheet" href="estilos/index.css">
	</head>	
	<body>
		<h1>Gráfico de Função</h1>
		<form name="especificacoes-form" method="GET" action="#" onsubmit="return false">
			<section>
				<label for="intervalo-menor-input">Intervalo menor</label>
				<input type="number" id="intervalo-menor-input" name="intervalo-menor-input" step="0.1" required>
			</section>
			<section>
				<label for="intervalo-maior-input">Intervalo maior</label>
				<input type="number" id="intervalo-maior-input" name="intervalo-maior-input" step="0.1" required>
			</section>
			<section>
				<label for="escala-input">Escala</label>
				<input type="number" id="escala-input" name="escala-input" step="0.1" required>
			</section>
			<section>
				<label for="taxa-variacao-input">Taxa de variação</label>
				<input type="number" id="taxa-variacao-input" name="taxa-variacao-input" step="0.1" required>
			</section>
			<button id="enviar-button" onclick="geraNovoGrafico()">Gerar</button>
		</form>	

    <section id="grafico-container">
        <section id="container-botoes-movimentacao">
			<section>
				<button id="botao-movimentacao-no" class="botoes-movimentacao">
					&#x2196
				</button>
				<button id="botao-movimentacao-n" class="botoes-movimentacao">
					&#x2191
				</button>
				<button id="botao-movimentacao-ne" class="botoes-movimentacao">
					&#x2197
				</button>
			</section>
			<section>
				<button id="botao-movimentacao-o" class="botoes-movimentacao">
					&#x2190
				</button>
				<button class="botoes-movimentacao">
					R
				</button>
				<button id="botao-movimentacao-l" class="botoes-movimentacao">
					&#x2192
				</button>
			</section>
			<section>
				<button id="botao-movimentacao-so" class="botoes-movimentacao">
					&#x2199
				</button>
				<button id="botao-movimentacao-s" class="botoes-movimentacao">
					&#x2193
				</button>
				<button id="botao-movimentacao-se" class="botoes-movimentacao">
					&#x2198
				</button>
			</section>
		</section>
		   
      	<canvas id="plano" width="1200" height="600"></canvas>
    </section>

		<script type="text/javascript" src="./grafico.js"></script>
		<script type="text/javascript" src="./script.js"></script>
		<script type="text/javascript" src="./botoes-movimentacao.js"></script>
	</body>
</html>
